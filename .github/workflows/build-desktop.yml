name: Build desktop installers

# Builds the PArAsYtE Browser desktop shell (see /desktop) for macOS,
# Windows, and Linux, and publishes them to a GitHub Release. Runs on
# GitHub's own hosted runners for each OS deliberately, rather than
# cross-compiling from one machine: electron-builder can only produce a
# real Windows .exe on macOS via Wine, which is unreliable (and largely
# broken) on Apple Silicon - building each target on its native OS avoids
# that entirely and is the standard way multi-platform Electron apps are
# built.
#
# Trigger with a tag push (e.g. `git tag desktop-v0.1.1 && git push --tags`)
# to publish a Release automatically, or run manually from the Actions tab
# (workflow_dispatch) to just sanity-check that all three platforms still
# build without publishing anything.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist_script: dist:mac
            artifact_glob: |
              desktop/release/*.dmg
              desktop/release/*.dmg.blockmap
          - os: windows-latest
            dist_script: dist:win
            artifact_glob: |
              desktop/release/*.exe
              desktop/release/*.exe.blockmap
          - os: ubuntu-latest
            dist_script: dist:linux
            artifact_glob: |
              desktop/release/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        run: npm ci

      - name: Install desktop shell dependencies
        working-directory: desktop
        run: npm ci

      # The web app reads these at build time (src/lib/supabase.ts) - set
      # in this repo's Settings -> Secrets and variables -> Actions. The
      # anon key is safe to expose client-side (it's protected by
      # Supabase RLS, same as it is in the Cloudflare Pages web build) but
      # is still stored as a secret here rather than committed to keep it
      # out of the workflow file's own history.
      - name: Build installer
        working-directory: desktop
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run ${{ matrix.dist_script }}

      - name: Upload build artifact (always, even on a manual dry run)
        uses: actions/upload-artifact@v4
        with:
          name: parasyte-browser-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          name: PArAsYtE Browser Desktop ${{ github.ref_name }}
          body: |
            Unsigned builds for all three platforms.

            - **macOS**: Gatekeeper will say "unidentified developer" - right-click the app and choose Open the first time.
            - **Windows**: SmartScreen will warn "Windows protected your PC" - click "More info" then "Run anyway".
            - **Linux**: the AppImage needs execute permission first: `chmod +x PArAsYtE*.AppImage`.
